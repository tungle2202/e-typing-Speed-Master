name: Release

# Push a tag like v1.1.0 -> build the Chromium and Firefox packages and attach them to a GitHub Release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The zip names come from manifest.json, so the tag must match its version
      - name: Check tag matches manifest version
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match manifest.json version ${version} (expected v${version})"
            exit 1
          fi

      - name: Build packages
        run: node scripts/build.mjs

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/ghosttyper-chromium-*.zip \
            dist/ghosttyper-firefox-*.zip
